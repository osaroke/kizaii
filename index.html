<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RACK NOTE">
<meta name="theme-color" content="#11131a">
<title>RACK NOTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: スタジオのラック棚。上に種類切替、フォルダ＝ラックのカード、下に固定ナビ */
/* Layout: スタジオのラック棚 × サイバーポップ。背景にネオンの光とグリッド、上に種類切替、フォルダ＝ラックのカード、下に固定ナビ */
:root{
  --bg:#0d0f1f; --panel:rgba(26,29,58,.72); --panel2:rgba(44,48,92,.9); --field:rgba(10,12,28,.75); --line:rgba(120,130,220,.22);
  --fg:#eef0ff; --muted:#9097c2; --accent:#5ef2e0; --idea:#ffb84d; --ink:#0d0f1f;
  --g1:#ff4fd8; --g2:#3d7bff; --g3:#5ef2e0;
  --danger:#ff6b81;
  --font-display:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --r:14px;
  color-scheme:dark;
}
/* カラーテーマ（7ダーク＋1ライト） */
[data-skin="pink"]{--bg:#170a1f;--panel:rgba(48,20,58,.72);--panel2:rgba(80,34,92,.9);--field:rgba(20,8,26,.75);--line:rgba(255,120,210,.22);--fg:#fff0fa;--muted:#c094b8;--accent:#ff5fc8;--idea:#ffd25e;--ink:#170a1f;--g1:#ff5fc8;--g2:#8a5cff;--g3:#ff8fd8}
[data-skin="blue"]{--bg:#060d1f;--panel:rgba(16,30,64,.72);--panel2:rgba(28,52,104,.9);--field:rgba(4,10,26,.75);--line:rgba(90,160,255,.22);--fg:#eaf4ff;--muted:#8aa2c8;--accent:#4fb6ff;--idea:#ffcf5c;--ink:#060d1f;--g1:#2b6bff;--g2:#00d5ff;--g3:#7aa8ff}
[data-skin="grape"]{--bg:#120b26;--panel:rgba(38,26,72,.72);--panel2:rgba(64,44,116,.9);--field:rgba(14,8,30,.75);--line:rgba(180,140,255,.24);--fg:#f3eeff;--muted:#a597c8;--accent:#c6ff5e;--idea:#ff9de2;--ink:#120b26;--g1:#7c4dff;--g2:#ff6ad5;--g3:#c6ff5e}
[data-skin="sunset"]{--bg:#1a0c16;--panel:rgba(56,24,40,.72);--panel2:rgba(92,40,62,.9);--field:rgba(24,8,18,.75);--line:rgba(255,140,120,.22);--fg:#fff1ec;--muted:#c49a9e;--accent:#ff8a5c;--idea:#ffd36b;--ink:#1a0c16;--g1:#ff4f7b;--g2:#ff9d4f;--g3:#a35cff}
[data-skin="hacker"]{--bg:#040e0c;--panel:rgba(10,36,30,.72);--panel2:rgba(18,60,50,.9);--field:rgba(2,12,10,.75);--line:rgba(77,255,166,.2);--fg:#e8fff4;--muted:#86b8a2;--accent:#4dffa6;--idea:#e6ff5c;--ink:#040e0c;--g1:#00c27a;--g2:#00e0c6;--g3:#4dffa6}
[data-skin="berry"]{--bg:#1c0a10;--panel:rgba(58,20,34,.72);--panel2:rgba(96,32,54,.9);--field:rgba(26,8,14,.75);--line:rgba(255,120,150,.22);--fg:#fff0f3;--muted:#c99aa6;--accent:#ff6b8f;--idea:#ffe08a;--ink:#1c0a10;--g1:#ff3d6e;--g2:#ffa3c2;--g3:#ff7a5c}
[data-skin="milk"]{--bg:#f3f0fb;--panel:rgba(255,255,255,.78);--panel2:#ffffff;--field:rgba(255,255,255,.9);--line:rgba(120,100,180,.2);--fg:#26203d;--muted:#7a7396;--accent:#e04fb0;--idea:#e08a1e;--ink:#ffffff;--g1:#ff8fd8;--g2:#8fb8ff;--g3:#b48cff;color-scheme:light}

/* 背景アニメーション */
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:var(--bg)}
.orb{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.38;will-change:transform}
.o1{background:radial-gradient(circle,var(--g1) 0,transparent 62%);top:-30vmax;left:-25vmax;animation:drift1 22s ease-in-out infinite alternate}
.o2{background:radial-gradient(circle,var(--g2) 0,transparent 62%);top:20vh;right:-35vmax;animation:drift2 26s ease-in-out infinite alternate}
.o3{background:radial-gradient(circle,var(--g3) 0,transparent 60%);bottom:-40vmax;left:-10vmax;opacity:.22;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,22vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vmax,-10vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(25vmax,-15vmax) scale(1.1)}}
.gridfloor{position:absolute;left:-50%;right:-50%;bottom:-6%;height:46%;
  background-image:linear-gradient(var(--g3) 1px,transparent 1px),linear-gradient(90deg,var(--g3) 1px,transparent 1px);
  background-size:44px 44px;transform:perspective(260px) rotateX(62deg);transform-origin:bottom;opacity:.2;
  -webkit-mask-image:linear-gradient(to top,#000 10%,transparent 90%);mask-image:linear-gradient(to top,#000 10%,transparent 90%);
  animation:gridrun 3.2s linear infinite}
@keyframes gridrun{to{background-position:0 44px}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px)}
.spark{position:absolute;color:var(--g3);font-size:12px;opacity:0;animation:twinkle 4s ease-in-out infinite;text-shadow:0 0 8px currentColor}
.spark:nth-child(3n){color:var(--g1)}
.spark:nth-child(3n+1){color:var(--accent)}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.5) rotate(0)}50%{opacity:.9;transform:scale(1.1) rotate(45deg)}}
[data-skin="milk"] .orb{opacity:.45}
[data-skin="milk"] .gridfloor{opacity:.28}
html.noanim .bgfx *{animation:none!important}
html.noanim .spark{opacity:.5}
@media (prefers-reduced-motion:reduce){.bgfx *{animation:none!important}.spark{opacity:.5}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{background:transparent!important}
html{background:var(--bg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;
  padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  margin:0 -16px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:18px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-family:var(--font-body);font-weight:500;letter-spacing:.04em;font-size:11px;color:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  display:grid;place-items:center;font-size:17px;flex:none}
.back{font-size:20px}

.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-top:14px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.seg.shelf{margin-top:8px}
.pill.v2{border-color:var(--danger);color:var(--danger)}
.pill.wt{min-width:22px;text-align:center}
.pill.wt.heavy{border-color:var(--idea);color:var(--idea)}
.pill.wt.light{opacity:.7}
.warn{margin:10px 2px 0;font-size:13px;color:var(--danger)}
.chiprow.wrap{flex-wrap:wrap;overflow:visible}
.dorm{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.dorm summary{cursor:pointer;font-weight:700;color:var(--muted);list-style-position:inside}
.dorm[open] summary{color:var(--fg)}
.dct{display:inline-block;margin-left:4px;font-size:12px;padding:0 8px;border-radius:99px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.dormrow{display:flex;align-items:center;gap:8px}
.dormrow .dname{flex:1;min-width:0;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 10px;font-weight:700}
.dormrow .dname small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.btn.sm{padding:6px 10px;font-size:13px;flex:none}
.idea.reason{border-style:dashed;background:color-mix(in srgb,var(--accent) 8%,transparent)}
.idea.reason .pin{flex:none;width:26px;text-align:center;font-size:14px;line-height:1.9}
.seg.shelf button{font-size:13px;padding-block:6px}
.seg.shelf small{opacity:.7;font-variant-numeric:tabular-nums;margin-left:2px}

.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;margin-top:12px}
.search input{flex:1;min-width:0;border:0;background:none;padding:11px 0;outline:none}

.label{font-family:var(--font-display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.label button{border:0;background:none;color:var(--accent);font-family:var(--font-body);letter-spacing:.02em;font-size:13px;text-transform:none;padding:0}

/* 構成バー */
.meter{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.meter i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:8px;height:8px;border-radius:2px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .n{font-family:var(--font-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .t{font-size:11px;color:var(--muted)}

/* フォルダ（ラック） */
.racks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rack{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);
  padding:12px 12px 12px 14px;min-height:96px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.rack::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.rack .screws{position:absolute;right:10px;top:10px;display:flex;gap:4px}
.rack .screws i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.rack .nm{font-weight:700;font-size:15px;line-height:1.3;padding-right:22px;word-break:break-all}
.rack .ct{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--c);line-height:1;font-variant-numeric:tabular-nums;margin-top:auto}
.rack .ct small{font-family:var(--font-body);font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.rack .chips{display:flex;gap:3px;flex-wrap:wrap}
.rack .chips i{width:14px;height:5px;border-radius:2px;background:var(--c);opacity:.55}
.rack.add{border-style:dashed;background:none;align-items:center;justify-content:center;color:var(--muted);font-weight:700}
.rack.add::before{display:none}

/* 製品リスト */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);
  border-radius:var(--r);padding:10px 12px}
.mono{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);
  font-weight:700;font-size:17px;color:#14122a;background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.item .body{flex:1;min-width:0}
.item .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.want{border-color:var(--idea);color:var(--idea)}

.pill.hide{opacity:.75}
.pill.gone{border-color:#e8775a;color:#e8775a}
.item.r-hide .nm,.item.r-gone .nm{opacity:.55}
.item.r-gone .nm{text-decoration:line-through}
.pill.trial{border-color:var(--accent);color:var(--accent)}
.bulb{font-size:12px;color:var(--idea);font-variant-numeric:tabular-nums;white-space:nowrap}
.star{color:var(--idea)}

.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}

.chiprow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--fg)}

/* 詳細 */
.hero{display:flex;gap:14px;align-items:center;margin-top:16px}
.hero .mono{width:64px;height:64px;font-size:24px;border-radius:14px}
.hero h1{font-size:21px;line-height:1.3;margin:0;word-break:break-all;text-wrap:balance}
.hero .sub{color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-all}
.memo{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;word-break:break-all;font-size:14px}
.idea{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.idea .tick{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--idea);background:none;display:grid;place-items:center;font-size:13px;color:var(--ink);margin-top:1px}
.idea.done .tick{background:var(--idea)}
.idea .tx{flex:1;min-width:0;white-space:pre-wrap;word-break:break-all;font-size:14px}
.idea.done .tx{color:var(--muted)}
.idea .dt{font-size:11px;color:var(--muted);display:block;margin-top:2px}
.idea .from{font-size:12px;color:var(--accent);display:block;margin-bottom:2px;border:0;background:none;padding:0;text-align:left}
.idea .x{border:0;background:none;color:var(--muted);font-size:15px;padding:2px 4px;flex:none}
.ideaadd{display:flex;gap:8px;margin-top:8px}
.ideaadd textarea{flex:1;min-width:0;resize:none;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);padding:10px 12px;outline:none}
.ideaadd button{flex:none;border:0;border-radius:12px;background:var(--idea);color:var(--ink);font-weight:700;padding:0 16px}

.btnrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-weight:700;min-width:120px}
.btn.primary{background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--g1)));border-color:transparent;color:var(--ink);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}

/* FAB */
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:0;
  background:linear-gradient(135deg,var(--accent),var(--g1));color:var(--ink);font-size:30px;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 8px 26px color-mix(in srgb,var(--g1) 45%,transparent);z-index:15;line-height:1}

/* 下ナビ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 75%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;color:var(--muted);font-size:11px;font-weight:700}
nav.tabs button span{font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--accent)}

/* シート */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:17px;margin:4px 0 12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;outline:none;width:100%;font-size:16px}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:32px;height:32px;border-radius:9px;border:2px solid transparent;background:var(--c)}
.swatches button.on{border-color:var(--fg)}
.toggle{display:flex;gap:6px;flex-wrap:wrap}
.toggle button{border:1px solid var(--line);background:var(--field);border-radius:99px;padding:6px 14px;font-size:14px;color:var(--muted)}
.toggle button.on{border-color:var(--accent);color:var(--fg)}
.frow{display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.frow .dot{width:12px;height:12px;border-radius:4px;background:var(--c);flex:none}
.frow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow button{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;flex:none}
.note{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:60;white-space:nowrap}
.pad{height:8px}
.mtools{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.mtools button{border:0;background:none;color:var(--accent);font-size:13px;padding:2px}
.mgroup{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.mgroup.open{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.mhead{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:13px 14px;text-align:left}
.mname{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:6px;height:6px;border-radius:50%}
.mct{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);min-width:22px;text-align:right}
.chev{color:var(--muted);font-size:18px;line-height:1;transition:transform .2s;flex:none}
.mgroup.open .chev{transform:rotate(90deg);color:var(--accent)}
.mlist{padding:0 8px 8px;animation:fold .2s ease-out}
.mlist .item{background:var(--field)}
@keyframes fold{from{opacity:0;transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.mlist{animation:none}}
.logo{background:linear-gradient(90deg,var(--accent),var(--g1) 55%,var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% 100%;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.tw{color:var(--g1);font-size:13px;display:inline-block;animation:twinkle2 2.4s ease-in-out infinite;text-shadow:0 0 8px currentColor}
@keyframes twinkle2{50%{transform:scale(.6) rotate(45deg);opacity:.5}}
html.noanim .logo,html.noanim .tw{animation:none}
.rack{backdrop-filter:none;transition:transform .15s,box-shadow .2s}
.rack:active{transform:scale(.97)}
.rack:not(.add){box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 0 1px color-mix(in srgb,var(--c) 18%,transparent)}
.seg button.on{box-shadow:inset 0 -2px 0 var(--accent),0 0 14px color-mix(in srgb,var(--accent) 22%,transparent)}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.th{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;background:none;display:flex;flex-direction:column}
.th .pv{height:44px;background:radial-gradient(circle at 25% 30%,var(--a) 0,transparent 55%),radial-gradient(circle at 80% 70%,var(--b) 0,transparent 55%),var(--k)}
.th span{font-size:11px;padding:4px 2px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
.th.on{border-color:var(--accent)}
.th.on span{color:var(--fg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.switch b{font-weight:700}
.sw{width:50px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.grip{flex:none;width:30px;height:44px;display:grid;place-items:center;color:var(--muted);font-size:18px;touch-action:none;cursor:grab;margin-left:-6px}
.frow .grip{height:32px;width:26px;margin:0}
.dragging{border-color:var(--accent)!important;box-shadow:0 8px 20px rgba(0,0,0,.45);position:relative;z-index:5}
.dragging .grip{color:var(--accent)}
.sortnote{font-size:12px;color:var(--muted);margin:-2px 2px 8px}
.swatches button.same{background:none;border:2px dashed var(--line);width:auto;padding:0 10px;font-size:12px;color:var(--muted)}
.swatches button.same.on{border-style:solid;border-color:var(--fg);color:var(--fg)}
.maker{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13px;color:var(--muted);margin:16px 2px 6px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.maker span{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.banner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:14px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-radius:var(--r);padding:12px 14px}
.banner b{display:block}
.banner small{color:var(--muted);font-size:12px}
</style>
</head>

  S.products.filter(p=>p.type===V.tab && p.folderId===f.id).sort((a,b)=>ordKey(a)-ordKey(b)).forEach((p,i)=>p.order=i);
  const byName=(a,b)=>a.name.localeCompare(b.name,'ja');
  if(mode==='maker') prods.sort((a,b)=>(a.maker||'').localeCompare(b.maker||'','ja')||byName(a,b));
  else if(mode==='name') prods.sort(byName);
  else if(mode==='new') prods.sort((a,b)=>(b.created||0)-(a.created||0));
  else prods.sort((a,b)=>a.order-b.order);
  const favs = mode==='manual' ? [] : prods.filter(p=>p.fav);
  let groups = ''; let cur = null;
  if(mode==='manual') groups = `<p class="sortnote">左の ≡ をつかんで上下にドラッグすると並べ替えられます</p><div class="list" id="sortList">${prods.map(p=>itemHTML(p,false,true)).join('')}</div>`;
  else if(mode!=='maker') groups = `<div class="list">${prods.map(p=>itemHTML(p,false)).join('')}</div>`;
  else {
    const by = new Map();
    prods.forEach(p=>{ const m=p.maker||'メーカー未設定'; if(!by.has(m)) by.set(m,[]); by.get(m).push(p); });
    V.open = V.open || {};
    const single = by.size===1;
    const allOpen = [...by.keys()].every(m=>single||V.open[f.id+'|'+m]);
    groups = by.size>1 ? `<div class="mtools"><button id="mall">${allOpen?'すべて閉じる':'すべて開く'}</button></div>` : '';
    groups += [...by.entries()].map(([m,list])=>{
      const open = single || !!V.open[f.id+'|'+m];
      const pips = list.slice(0,8).map(p=>`<i style="background:${colorOf(p)}"></i>`).join('');
      return `<div class="mgroup ${open?'open':''}">
        <button class="mhead" data-m="${esc(m)}" aria-expanded="${open}"><span class="mname">${esc(m)}</span><span class="pips">${pips}</span><span class="mct">${list.length}</span><span class="chev">›</span></button>
        ${open?`<div class="list mlist">${list.map(p=>itemHTML(p,false)).join('')}</div>`:''}</div>`;
    }).join('');
  }
  const sorts = [['maker','メーカー別'],['name','名前順'],['new','追加が新しい順'],['manual','自分で並べる']]
    .map(([k,l])=>`<button class="chip ${mode===k?'on':''}" data-sort="${k}">${l}</button>`).join('');
  const chips = [['all','すべて'],['own','所持'],['want','欲しい'],['trial','体験版'],['fav','★ お気に入り']]
    .map(([k,l])=>`<button class="chip ${V.statusFilter===k?'on':''}" data-s="${k}">${l} ${counts[k]}</button>`).join('');
  $app.innerHTML = `
    <header class="top"><button class="iconbtn back" id="back" aria-label="戻る">‹</button>
      <div class="brand" style="letter-spacing:.02em;font-family:var(--font-body)">${esc(f.name)}<small>${TYPE[V.tab]}フォルダ${V.shelf!=='show'?'・'+SHELF[V.shelf]:''}</small></div>
      <button class="iconbtn" id="fedit" aria-label="フォルダを編集">✎</button></header>
    <div style="height:4px;background:${f.color};margin:0 -16px;opacity:.8"></div>
    <div class="label">絞り込み</div>
    <div class="chiprow">${chips}</div>
    ${rolesHere.length?`<div class="label">役割</div><div class="chiprow">${['',...rolesHere].map(r=>`<button class="chip ${(V.roleFilter||'')===r?'on':''}" data-rf="${r}">${r||'すべて'}</button>`).join('')}</div>`:''}
    <div class="label">並べ替え</div>
    <div class="chiprow">${sorts}</div>
    <div class="label">${prods.length}件</div>
    ${favs.length&&V.statusFilter!=='fav'?`<div class="maker" style="color:var(--idea)">★ お気に入り<span>${favs.length}</span></div><div class="list">${favs.map(p=>itemHTML(p,false)).join('')}</div>`:''}
    ${prods.length?groups:
      `<div class="empty"><b>まだ製品がありません</b>右下の ＋ から、このフォルダに製品を追加できます</div>`}
    <div class="pad"></div>`;
  document.getElementById('back').onclick=()=>{V.folder=null;render();};
  document.getElementById('fedit').onclick=()=>folderForm(V.tab,f);
  $app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{V.statusFilter=b.dataset.s;render();});
  $app.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{V.roleFilter=b.dataset.rf;render();});
  $app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=f.id+'|'+b.dataset.m; V.open[k]=!V.open[k]; render();});
  const mall=document.getElementById('mall');
  if(mall) mall.onclick=()=>{ const ms=[...$app.querySelectorAll('[data-m]')].map(b=>f.id+'|'+b.dataset.m);
    const to = !ms.every(k=>V.open[k]); ms.forEach(k=>V.open[k]=to); render(); };
  $app.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{S.sortMode=b.dataset.sort;save();render();});
  const sl=document.getElementById('sortList');
  if(sl) makeSortable(sl,'.item',()=>{
    const ids=[...sl.querySelectorAll('[data-p]')].map(x=>x.dataset.p);

  bindCommon();
}

function importPreset(){
  const ensure=(t,name)=>{ let f=S.folders[t].find(x=>x.name===name);
    if(!f){ f={id:uid(),name,color:COLORS[S.folders[t].length%COLORS.length]}; S.folders[t].push(f); } return f; };
  // フォルダをそろえて、並びを種類一覧の順にする（自作フォルダは後ろ）
  [['fx',PRESET.fxFolders],['inst',PRESET.instFolders],['gear',PRESET.gearFolders]].forEach(([t,list])=>{
    list.forEach(n=>ensure(t,n));
    const ord=n=>{const i=list.indexOf(n);return i<0?999:i;};
    S.folders[t].sort((a,b)=>ord(a.name)-ord(b.name));
  });
  const have=new Set(S.products.map(p=>p.type+'|'+p.name.toLowerCase()));
  let added=0;
  [['fx',PRESET.fx],['inst',PRESET.inst],['gear',PRESET.gear]].forEach(([t,rows])=>rows.forEach(([name,maker,folder,format,memo,status])=>{
    if(have.has(t+'|'+name.toLowerCase())) return;
    S.products.push({id:uid(),type:t,folderId:ensure(t,folder).id,name,maker,format,memo,status:status||'own',rank:tidyRank(t,name),fav:false,ideas:[],price:'',date:'',url:'',created:Date.now()});
    { const np=S.products[S.products.length-1]; addReason(np); applyMeta(np); } added++;}));
  S.presetSeen=PRESET_N; S.tidySeen=TIDY_VER; save(); render(); toast(`${added}件を取り込みました`);
}
// 整理結果（一軍／隠す／削除済み）を、登録済みの製品に反映する。何も消さない
function applyTidy(){ let n=0;
  S.products.forEach(p=>{ const r=tidyRank(p.type,p.name); if(r && p.rank!==r){ p.rank=r; n++; } const mm=TIDY_MEMO[p.name.toLowerCase()]; if(mm && !p.memo){ p.memo=mm; n++; } if(addReason(p)) n++; n+=applyMeta(p); });
  importPreset(); toast(`整理結果を反映しました（${n}件）`);
}
function importJSON(txt){
  try{ const d=JSON.parse(txt); if(!d.folders||!Array.isArray(d.products)) throw 0;
    S=d; save(); closeSheet(); render(); toast(`読み込みました（${d.products.length}件）`);
  }catch(e){ toast('読み込めませんでした。RACK NOTE のJSONか確認してください'); }
}

// ≡ をつかんでドラッグする並べ替え（タッチ・マウス両対応）
function makeSortable(box, sel, onEnd){
  box.addEventListener('pointerdown', e=>{
    const g=e.target.closest('.grip'); if(!g || !box.contains(g)) return;
    const item=g.closest(sel); if(!item) return;
    e.preventDefault(); item.classList.add('dragging');
    try{ g.setPointerCapture(e.pointerId); }catch(_){}
    const move=ev=>{
      const y=ev.clientY;
      const sibs=[...box.querySelectorAll(sel)].filter(x=>x!==item);
      let placed=false;
      for(const s2 of sibs){ const r=s2.getBoundingClientRect();
        if(y < r.top + r.height/2){ if(item.nextElementSibling!==s2) box.insertBefore(item,s2); placed=true; break; } }
      if(!placed && box.lastElementChild!==item) box.appendChild(item);
      if(y < 90) window.scrollBy(0,-10); else if(y > innerHeight-110) window.scrollBy(0,10);
    };
    const up=()=>{ g.removeEventListener('pointermove',move); g.removeEventListener('pointerup',up); g.removeEventListener('pointercancel',up);
      item.classList.remove('dragging'); onEnd(); };
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
  });
}
function bindCommon(){ $app.querySelectorAll('[data-p]').forEach(b=>b.onclick=e=>{ if(e.target.closest('.grip')) return; openProduct(b.dataset.p); }); }
function openProduct(id){ V.product=id; render(); window.scrollTo(0,0); }

/* ---------- sheets ---------- */
function sheet(html, onMount){
  $layer.innerHTML = `<div class="scrim"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
  const scrim=$layer.firstChild;
  scrim.addEventListener('click',e=>{ if(e.target===scrim || e.target.closest('[data-close]')) closeSheet(); });
  onMount && onMount(scrim.querySelector('.sheet'));
}
function closeSheet(){ $layer.innerHTML=''; }
function confirmSheet(title,msg,okLabel,ok){
  sheet(`<h2>${esc(title)}</h2><p class="note" style="font-size:14px">${esc(msg)}</p>
    <div class="btnrow"><button class="btn" data-close>やめる</button><button class="btn danger" id="ok">${esc(okLabel)}</button></div>`,
    el=>el.querySelector('#ok').onclick=()=>{closeSheet();ok();});
}

function productForm(p){
  const isNew = !p;
  const d = p || { type:V.tab, folderId: V.folder || S.folders[V.tab][0]?.id, status:'own' };
  let type = d.type, status = d.status, rank = d.rank || '', pcolor = d.color || '', weight = d.weight || '', roles = [...(d.roles||[])];
  const folderOpts = t => S.folders[t].map(f=>`<option value="${f.id}" ${f.id===d.folderId?'selected':''}>${esc(f.name)}</option>`).join('');
  sheet(`<h2>${isNew?'製品を追加':'製品を編集'}</h2>
    <div class="field"><label for="pf-name">製品名 *</label><input id="pf-name" value="${esc(d.name)}" placeholder="例：Serum 2"></div>
    <div class="field"><label for="pf-maker">メーカー</label><input id="pf-maker" value="${esc(d.maker)}" placeholder="例：Xfer Records"></div>
    <div class="field"><label>種類</label><div class="toggle" id="pf-type">${Object.entries(TYPE).map(([k,l])=>`<button data-v="${k}" class="${type===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="field"><label for="pf-folder">フォルダ</label><select id="pf-folder">${folderOpts(type)}</select></div>
    <div class="field"><label>状態</label><div class="toggle" id="pf-status">${Object.entries(STATUS).map(([k,l])=>`<button data-v="${k}" class="${status===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="field"><label>コレクション</label><div class="toggle" id="pf-rank">${[['','未設定'],...Object.entries(RANK)].map(([k,l])=>`<button data-v="${k}" class="${rank===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="field"><label>重さ</label><div class="toggle" id="pf-weight">${[['','未設定'],...Object.entries(WEIGHT)].map(([k,l])=>`<button data-v="${k}" class="${weight===k?'on':''}">${l}</button>`).join('')}</div></div>
    <div class="field"><label>役割（複数選べます）</label><div class="chiprow wrap" id="pf-roles">${ROLE_LIST.map(r=>`<button type="button" class="chip ${roles.includes(r)?'on':''}" data-role="${r}">${r}</button>`).join('')}</div></div>
    <div class="two">
      <div class="field"><label for="pf-format">形式</label><input id="pf-format" value="${esc(d.format)}" placeholder="VST3 / Kontakt"></div>
      <div class="field"><label for="pf-price">価格</label><input id="pf-price" value="${esc(d.price)}" placeholder="¥12,000"></div>
    </div>
    <div class="field"><label for="pf-date">購入日</label><input id="pf-date" type="date" value="${esc(d.date)}"></div>
    <div class="field"><label for="pf-url">リンク</label><input id="pf-url" type="url" value="${esc(d.url)}" placeholder="https://"></div>
    <div class="field"><label>アイコンの色</label><div class="swatches" id="pf-color"><button class="same ${pcolor?'':'on'}" data-pc="">フォルダと同じ</button>${COLORS.map(c=>`<button style="--c:${c}" data-pc="${c}" class="${c===pcolor?'on':''}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="field"><label for="pf-memo">メモ</label><textarea id="pf-memo" placeholder="特徴、よく使うプリセット、注意点など">${esc(d.memo)}</textarea></div>
    <div class="btnrow">${isNew?'':'<button class="btn danger" id="pf-del">削除</button>'}<button class="btn primary" id="pf-save">${isNew?'追加する':'保存する'}</button></div>`,
  el=>{
    el.querySelectorAll('#pf-type button').forEach(b=>b.onclick=()=>{type=b.dataset.v;
      el.querySelectorAll('#pf-type button').forEach(x=>x.classList.toggle('on',x===b));
      el.querySelector('#pf-folder').innerHTML=folderOpts(type);});
    el.querySelectorAll('#pf-status button').forEach(b=>b.onclick=()=>{status=b.dataset.v;
      el.querySelectorAll('#pf-status button').forEach(x=>x.classList.toggle('on',x===b));});
    el.querySelectorAll('#pf-weight button').forEach(b=>b.onclick=()=>{weight=b.dataset.v; el.querySelectorAll('#pf-weight button').forEach(x=>x.classList.toggle('on',x===b));});
    el.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{const r=b.dataset.role; roles=roles.includes(r)?roles.filter(x=>x!==r):[...roles,r]; b.classList.toggle('on',roles.includes(r));});
    el.querySelectorAll('#pf-rank button').forEach(b=>b.onclick=()=>{rank=b.dataset.v;
      el.querySelectorAll('#pf-rank button').forEach(x=>x.classList.toggle('on',x===b));});
    el.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{pcolor=b.dataset.pc; el.querySelectorAll('[data-pc]').forEach(x=>x.classList.toggle('on',x===b));});
    el.querySelector('#pf-save').onclick=()=>{
      const name=el.querySelector('#pf-name').value.trim();
      if(!name){ el.querySelector('#pf-name').focus(); return toast('製品名を入力してください'); }
      const v = { name, maker:el.querySelector('#pf-maker').value.trim(), type, folderId:el.querySelector('#pf-folder').value, status, rank, weight, roles,
        format:el.querySelector('#pf-format').value.trim(), price:el.querySelector('#pf-price').value.trim(), date:el.querySelector('#pf-date').value,
        url:el.querySelector('#pf-url').value.trim(), memo:el.querySelector('#pf-memo').value.trim(), color:pcolor };
      if(isNew){ const np={id:uid(),fav:false,ideas:[],created:Date.now(),...v}; S.products.push(np); save(); closeSheet(); V.tab=type; V.product=np.id; render(); toast('追加しました'); }
      else { Object.assign(p,v); save(); closeSheet(); V.tab=type; render(); toast('保存しました'); }
    };
    const del=el.querySelector('#pf-del');
    if(del) del.onclick=()=>confirmSheet(`「${p.name}」を削除しますか？`,`アイデア ${ideasOf(p).length}件も一緒に消えます。`,'削除する',()=>{
      S.products=S.products.filter(x=>x.id!==p.id); save(); V.product=null; render(); toast('削除しました');});
    if(isNew) setTimeout(()=>el.querySelector('#pf-name').focus(),250);
  });
}

function ideaForm(pid,iid){
  const p=S.products.find(x=>x.id===pid), i=p.ideas.find(x=>x.id===iid);
  sheet(`<h2>アイデアを編集</h2><p class="note" style="margin-top:-6px">${esc(p.name)}</p>
    <div class="field"><textarea id="it">${esc(i.text)}</textarea></div>
    <div class="btnrow"><button class="btn danger" id="idel">削除</button><button class="btn primary" id="isave">保存する</button></div>`,
  el=>{
    el.querySelector('#isave').onclick=()=>{const v=el.querySelector('#it').value.trim(); if(!v) return; i.text=v; save(); closeSheet(); render();};
    el.querySelector('#idel').onclick=()=>{p.ideas=p.ideas.filter(x=>x.id!==iid); save(); closeSheet(); render(); toast('削除しました');};
  });
}

function folderForm(t,f){
  const isNew=!f; let color = f?.color || COLORS[S.folders[t].length % COLORS.length];
  const cnt = f ? S.products.filter(p=>p.type===t && p.folderId===f.id).length : 0;
  sheet(`<h2>${isNew?'フォルダを追加':'フォルダを編集'}<span class="note" style="font-weight:500"> ・ ${TYPE[t]}</span></h2>
    <div class="field"><label for="ff-name">フォルダ名</label><input id="ff-name" value="${esc(f?.name)}" placeholder="例：アンビエント"></div>
    <div class="field"><label>色</label><div class="swatches">${COLORS.map(c=>`<button style="--c:${c}" data-c="${c}" class="${c===color?'on':''}" aria-label="${c}"></button>`).join('')}</div></div>
    <div class="btnrow">${isNew?'':'<button class="btn danger" id="ff-del">削除</button>'}<button class="btn primary" id="ff-save">${isNew?'追加する':'保存する'}</button></div>`,
  el=>{
    el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c; el.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));});
    el.querySelector('#ff-save').onclick=()=>{const name=el.querySelector('#ff-name').value.trim(); if(!name) return toast('フォルダ名を入力してください');
      if(isNew) S.folders[t].push({id:uid(),name,color}); else Object.assign(f,{name,color});
      save(); closeSheet(); render(); toast(isNew?'フォルダを追加しました':'保存しました');};
    const del=el.querySelector('#ff-del');
    if(del) del.onclick=()=>{
      if(S.folders[t].length<=1) return toast('最後のフォルダは削除できません');
      confirmSheet(`「${f.name}」を削除しますか？`, cnt?`中の${cnt}件の製品は「未分類」フォルダへ移動します。`:'このフォルダは空です。','削除する',()=>{
        S.folders[t]=S.folders[t].filter(x=>x.id!==f.id);
        if(cnt){ let u=S.folders[t].find(x=>x.name==='未分類'); if(!u){u={id:uid(),name:'未分類',color:'#7f8aa8'};S.folders[t].push(u);}
          S.products.forEach(p=>{if(p.type===t&&p.folderId===f.id)p.folderId=u.id;}); }
        if(V.folder===f.id) V.folder=null; save(); render(); toast('削除しました');});
    };
  });
}

function folderManager(t){
  const draw = el => {
    el.querySelector('#fl').innerHTML = S.folders[t].map((f,i)=>`<div class="frow" data-fid="${f.id}" style="--c:${f.color}"><span class="grip">≡</span><span class="dot"></span><span class="nm">${esc(f.name)}</span>
      <button data-up="${i}" ${i===0?'disabled style="opacity:.3"':''} aria-label="上へ">↑</button>
      <button data-dn="${i}" ${i===S.folders[t].length-1?'disabled style="opacity:.3"':''} aria-label="下へ">↓</button>
      <button data-ed="${f.id}" aria-label="編集">✎</button></div>`).join('');
    el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[S.folders[t][i-1],S.folders[t][i]]=[S.folders[t][i],S.folders[t][i-1]];save();draw(el);render();});
    el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[S.folders[t][i+1],S.folders[t][i]]=[S.folders[t][i],S.folders[t][i+1]];save();draw(el);render();});
    el.querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>folderForm(t,S.folders[t].find(f=>f.id===b.dataset.ed)));
  };
  const drag = el => makeSortable(el.querySelector('#fl'),'.frow',()=>{
    const ids=[...el.querySelectorAll('[data-fid]')].map(x=>x.dataset.fid);
    S.folders[t]=ids.map(id=>S.folders[t].find(f=>f.id===id)); save(); draw(el); render(); });
  sheet(`<h2>${TYPE[t]}フォルダ</h2><p class="sortnote">≡ をドラッグするか ↑↓ で並べ替え、✎ で名前と色を変えられます</p><div class="list" id="fl"></div>
    <div class="btnrow"><button class="btn" id="fadd">＋ フォルダを追加</button><button class="btn primary" data-close>完了</button></div>`,
    el=>{draw(el); drag(el); el.querySelector('#fadd').onclick=()=>folderForm(t);});
}

/* ---------- global ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  const g=b.dataset.go; if(V.tab!==g) V.q='';
  V.tab=g; V.folder=null; V.product=null; closeSheet(); render(); window.scrollTo(0,0);
});
$fab.onclick=()=>productForm(null);
applySkin();
render();
})();
</script>
